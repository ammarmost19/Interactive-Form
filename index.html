<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="signup-container">
            <div class="signup-header">
                <a href="/">Formly</a>
                <p class="main-title">Create Your Account</p>
                <p class="sub-title">Join thousands of professionals today.</p>
            </div>
            <div class="signup-body">
                <label for="full-name">Full Name</label>
                <div class="full-name-input input-wrapper">
                    <input type="text" id="full-name" placeholder="John Doe">
                </div>
    
                <label for="email">Email Address</label>
                <div class="email-input input-wrapper">
                    <input type="email" id="email"  placeholder="name@company.com">
                </div>
    
                <label for="number">Phone Number</label>
                <div class="phone-input input-wrapper">
                    <input type="tel" id="number" placeholder="+1 (555) 000-0000">
                </div>
    
                <label for="password">Password</label>
                <div class="password-input input-wrapper">
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <div class="pass-checker">
                    <div class="weak"></div>
                    <div class="medium"></div>
                    <div class="strong"></div>
                    <p data-status='["Weak", "Medium", "Strong"]'></p>
                </div>
                <div class="privacy-policy">
                    <input type="checkbox">
                    <p>I agree to the <a href="">Terms of Service</a> and <a href="">Privacy Policy.</a></p>
                </div>
                <div class="signup-button">
                    <button type="submit">Create Account <img src="./assets/arrow-Icon.svg" alt="arrow icon"></button>
                </div>
                <div class="login-phrase">
                    <p>Already have an account? <a href="/">Log in</a></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
